<main class="users-page">
  <header class="page-header">
    <h1>Users</h1>
    <button mat-flat-button color="primary" (click)="openInviteDialog()">
      <mat-icon>person_add</mat-icon>
      Invite User
    </button>
  </header>

  <ng-container *ngIf="loading$ | async">
    <div class="loading">
      <mat-progress-spinner mode="indeterminate" diameter="36"></mat-progress-spinner>
    </div>
  </ng-container>

  <!-- Active users -->
  <mat-card class="section-card">
    <mat-card-header>
      <mat-card-title>Active Users</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="(users$ | async) ?? []" class="full-width-table">

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let user">{{ user.role }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let user">
            <span class="status-chip" [class.active]="user.isActive" [class.inactive]="!user.isActive">
              {{ user.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let user">
            <div class="action-row">
              <button mat-icon-button
                [matTooltip]="user.isActive ? 'Deactivate' : 'Activate'"
                (click)="toggleActive(user)">
                <mat-icon>{{ user.isActive ? 'block' : 'check_circle' }}</mat-icon>
              </button>
              <button mat-icon-button color="warn" matTooltip="Delete user" (click)="deleteUser(user)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="userColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: userColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data" [attr.colspan]="userColumns.length">No users yet.</td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>

  <!-- Pending invites -->
  <mat-card class="section-card">
    <mat-card-header>
      <mat-card-title>Pending Invites</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="(pendingInvites$ | async) ?? []" class="full-width-table">

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let invite">{{ invite.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let invite">{{ invite.role }}</td>
        </ng-container>

        <ng-container matColumnDef="expires">
          <th mat-header-cell *matHeaderCellDef>Expires</th>
          <td mat-cell *matCellDef="let invite">{{ invite.expiresAt | date:'medium' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let invite">
            <button mat-icon-button color="warn" matTooltip="Revoke invite" (click)="revokeInvite(invite)">
              <mat-icon>cancel</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="inviteColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: inviteColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data" [attr.colspan]="inviteColumns.length">No pending invites.</td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>
</main>
