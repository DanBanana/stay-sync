<h2 mat-dialog-title>Invite User</h2>

<mat-dialog-content>

  <!-- Form state -->
  <ng-container *ngIf="!generatedLink">
    <form [formGroup]="form" (ngSubmit)="submit()">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="off" />
        <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required.</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email address.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</mat-option>
        </mat-select>
      </mat-form-field>

    </form>
  </ng-container>

  <!-- Generated link state -->
  <ng-container *ngIf="generatedLink">
    <div class="link-state">
      <mat-icon class="success-icon">link</mat-icon>
      <p class="link-label">Share this invite link. It expires in <strong>48 hours</strong> and can only be used once.</p>

      <div class="link-box">
        <input class="link-input" [value]="generatedLink" readonly />
        <button mat-icon-button type="button" (click)="copyLink()" [matTooltip]="copied ? 'Copied!' : 'Copy link'">
          <mat-icon>{{ copied ? 'check' : 'content_copy' }}</mat-icon>
        </button>
      </div>

      <p class="security-note">
        <mat-icon class="note-icon">security</mat-icon>
        Share this link securely. Do not post it publicly.
      </p>
    </div>
  </ng-container>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <ng-container *ngIf="!generatedLink">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button mat-flat-button color="primary" type="button" (click)="submit()" [disabled]="submitting || form.invalid">
      {{ submitting ? 'Generating…' : 'Generate Link' }}
    </button>
  </ng-container>
  <ng-container *ngIf="generatedLink">
    <button mat-flat-button color="primary" type="button" (click)="close()">Done</button>
  </ng-container>
</mat-dialog-actions>
